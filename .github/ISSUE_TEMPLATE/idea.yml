name: Idea
description: Suggest a feature or a change
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: The change you have in mind, if you have one.
