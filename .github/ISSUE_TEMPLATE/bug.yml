name: Bug report
description: Something in opeq does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problems go to hello@opeq.io, not here. Never paste recovery words, vault files or private keys."
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: ["Chrome extension", "USB edition", "Web wallet", "SDK", "DOKO", "Other"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.9.0"
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network
      placeholder: "Solana mainnet, Base, devnet..."
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: The steps, what you expected and what you saw instead. A transaction signature or address helps.
    validations:
      required: true
